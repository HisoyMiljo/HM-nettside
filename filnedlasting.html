<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last ned fil | Hisøy Miljø AS</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b4f56" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/main.css" />
    <script defer src="./scripts/main.js"></script>
    <script defer src="./scripts/file-portal.js"></script>
  </head>
  <body data-page="files">
    <div class="page-shell">
      <header class="site-header">
        <div class="site-header__inner">
          <a class="brand" href="./index.html" aria-label="Hisøy Miljø AS hjem">
            <img src="./assets/images/logo-hisoy-miljo.png" alt="Hisøy Miljø AS logo" />
          </a>
        </div>
      </header>

      <main>
        <section class="section file-download-section">
          <div class="file-download" data-file-portal="download" data-reveal>
            <p class="eyebrow">Hisøy Miljø AS</p>
            <h1>Last ned delt fil</h1>
            <p>Du har fått en unik lenke til en fil fra Hisøy Miljø.</p>
            <div class="file-download__details">
              <h2 data-download-name>Henter filinformasjon …</h2>
              <p data-download-meta></p>
            </div>
            <p class="form-status" data-download-status aria-live="polite"></p>
            <button class="button" data-download-button type="button" hidden>Last ned fil</button>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="site-footer__inner">
          <div class="site-footer__brand">
            <img src="./assets/images/logo-hisoy-miljo.png" alt="Hisøy Miljø AS logo" />
            <p>Hisøy Miljø AS - din los</p>
          </div>
          <div class="site-footer__meta">
            <a href="tel:+4792210245">+47 922 10 245</a>
            <a href="mailto:sbo@hmiljo.no">sbo@hmiljo.no</a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
